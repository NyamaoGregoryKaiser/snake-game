<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            background-color: #1a1a2e;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            padding: 15px;
            border-radius: 10px;
            background-color: #16213e;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
            width: 100%;
            max-width: 400px;
            min-width: 280px;
            aspect-ratio: 1/1.1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }
        
        .header {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
        }
        
        h1 {
            font-size: clamp(1.5rem, 4vw, 2rem);
            margin: 0;
            background: linear-gradient(to right, #4ecca3, #0eff00);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 5px rgba(78, 204, 163, 0.3);
        }
        
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            width: 100%;
            gap: 5px;
        }
        
        .score-box, .high-score-box {
            background-color: #0f3460;
            padding: 8px;
            border-radius: 5px;
            font-size: clamp(0.9rem, 2.5vw, 1rem);
            flex: 1;
            text-align: center;
            min-width: 0;
        }
        
        .score-value, .high-score-value {
            color: #4ecca3;
            font-weight: bold;
        }
        
        canvas {
            border: 2px solid #4ecca3;
            border-radius: 5px;
            background-color: #0f3460;
            display: block;
            width: 100%;
            height: auto;
            aspect-ratio: 1/1;
            max-width: 350px;
            max-height: 350px;
        }
        
        .controls {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            width: 100%;
            gap: 5px;
        }
        
        button {
            background-color: #4ecca3;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            color: #1a1a2e;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            font-size: clamp(0.8rem, 2vw, 0.9rem);
            flex: 1;
            min-width: 0;
        }
        
        button:hover {
            background-color: #0eff00;
            transform: scale(1.05);
        }
        
        .legend {
            display: flex;
            justify-content: center;
            margin-top: 10px;
            flex-wrap: wrap;
            gap: 5px;
            width: 100%;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 0 3px;
            font-size: clamp(0.7rem, 1.8vw, 0.8rem);
        }
        
        .legend-color {
            width: clamp(10px, 2.5vw, 12px);
            height: clamp(10px, 2.5vw, 12px);
            margin-right: 3px;
            border-radius: 3px;
        }
        
        .game-over-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 46, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
            border-radius: 10px;
        }
        
        .game-over-text {
            font-size: clamp(1.5rem, 4vw, 1.8rem);
            margin-bottom: 15px;
            color: #ff6b6b;
        }
        
        .game-pause-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(26, 26, 46, 0.8);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            display: none;
            border-radius: 10px;
        }
        
        .game-pause-text {
            font-size: clamp(1.5rem, 4vw, 1.8rem);
            margin-bottom: 15px;
            color: #4ecca3;
        }
        
        .mobile-controls {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            width: 100%;
            max-width: 250px;
        }
        
        .direction-buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }
        
        .horizontal-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .direction-buttons button {
            width: clamp(40px, 12vw, 50px);
            height: clamp(40px, 12vw, 50px);
            font-size: clamp(16px, 5vw, 20px);
        }
        
        .direction-buttons button:active {
            background-color: #0eff00;
            transform: scale(0.95);
        }
        
        @media (max-width: 600px) {
            body {
                padding: 5px;
            }
            
            .game-container {
                padding: 10px;
                width: 95%;
            }
            
            .info-panel {
                flex-direction: column;
                gap: 3px;
            }
            
            .controls {
                flex-direction: column;
            }
            
            button {
                width: 100%;
            }
        }
        
        @media (min-width: 601px) {
            .mobile-controls {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="header">
            <h1>SNAKE MASTER</h1>
        </div>
        
        <div class="info-panel">
            <div class="score-box">
                Score: <span id="score" class="score-value">0</span>
            </div>
            <div class="high-score-box">
                High Score: <span id="highScore" class="high-score-value">0</span>
            </div>
        </div>
        
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        
        <div class="controls">
            <button id="startButton">Start Game</button>
            <button id="pauseButton">Pause</button>
            <button id="restartButton">Restart</button>
        </div>
        
        <div class="legend">
            <div class="legend-item">
                <div class="legend-color" style="background-color: #4ecca3;"></div>
                <span>Snake</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ffbd69;"></div>
                <span>Food (+10)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #ff6b6b;"></div>
                <span>Fire (-5)</span>
            </div>
            <div class="legend-item">
                <div class="legend-color" style="background-color: #c8ffff;"></div>
                <span>Speed Boost</span>
            </div>
        </div>
        
        <div id="gameOverScreen" class="game-over-screen">
            <div class="game-over-text">Game Over!</div>
            <div>Your Score: <span id="finalScore">0</span></div>
            <button id="newGameButton" style="margin-top: 20px;">New Game</button>
        </div>
        
        <div id="gamePauseScreen" class="game-pause-screen">
            <div class="game-pause-text">Game Paused</div>
            <button id="resumeButton" style="margin-top: 20px;">Resume</button>
        </div>
    </div>

    <script>
// Game elements and state
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
let box = 20;
let totalBoxes = canvas.width / box;

// Audio elements
const eatSound = new Audio('https://cdnjs.cloudflare.com/ajax/libs/sound-effects/1.0.2/eat.mp3');
const gameOverSound = new Audio('https://cdnjs.cloudflare.com/ajax/libs/sound-effects/1.0.2/gameover.mp3');
const fireSound = new Audio('https://cdnjs.cloudflare.com/ajax/libs/sound-effects/1.0.2/hit.mp3');
const boostSound = new Audio('https://cdnjs.cloudflare.com/ajax/libs/sound-effects/1.0.2/boost.mp3');

// Device detection
const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
// DOM Elements
const scoreElement = document.getElementById("score");
const highScoreElement = document.getElementById("highScore");
const finalScoreElement = document.getElementById("finalScore");
const gameOverScreen = document.getElementById("gameOverScreen");
const gamePauseScreen = document.getElementById("gamePauseScreen");

// Buttons
const startButton = document.getElementById("startButton");
const pauseButton = document.getElementById("pauseButton");
const restartButton = document.getElementById("restartButton");
const newGameButton = document.getElementById("newGameButton");
const resumeButton = document.getElementById("resumeButton");

// Game control states
let gameRunning = false;
let gamePaused = false;
let gameLoop;
let speedBoostActive = false;
let speedBoostTimer = null;

// Speed parameters
let initialSpeed = 200; // Starting speed in milliseconds (slower)
let currentSpeed = initialSpeed;
let baseSpeed = initialSpeed; // Current base speed (changes with score)
let boostSpeed = initialSpeed * 0.5; // Speed boost is 50% faster than current speed
let speedIncreasePerPoint = 0.5; // Speed decrease in ms per point
let minSpeed = 70; // Fastest possible speed in milliseconds

// Game state
let snake = [];
let food = {};
let fire = {};
let speedBoost = {};
let direction = "";
let nextDirection = "";
let score = 0;

// Load high score from localStorage
let highScore = localStorage.getItem("snakeHighScore") || 0;
highScoreElement.textContent = highScore;

// Function to resize canvas based on container size
function resizeCanvas() {
    const container = canvas.parentElement;
    const containerWidth = container.clientWidth;
    const containerHeight = container.clientHeight;
    
    // Calculate new canvas size maintaining aspect ratio
    const size = Math.min(containerWidth, containerHeight);
    canvas.width = size;
    canvas.height = size;
    
    // Update box size and total boxes
    box = size / 20;
    totalBoxes = 20;
    
    // Redraw the game if it's running
    if (gameRunning && !gamePaused) {
        draw();
    }
}

// Initialize resize observer
const resizeObserver = new ResizeObserver(resizeCanvas);
resizeObserver.observe(canvas.parentElement);

// Add visual effects
function drawSnakeSegment(x, y, isHead = false) {
    const gradient = ctx.createLinearGradient(x * box, y * box, (x + 1) * box, (y + 1) * box);
    if (isHead) {
        gradient.addColorStop(0, '#5eff00');
        gradient.addColorStop(1, '#4ecca3');
    } else {
        gradient.addColorStop(0, '#4ecca3');
        gradient.addColorStop(1, '#3a9d8f');
    }
    
    ctx.fillStyle = gradient;
    ctx.fillRect(x * box, y * box, box, box);
    
    // Add border
    ctx.strokeStyle = '#0f3460';
    ctx.lineWidth = 2;
    ctx.strokeRect(x * box, y * box, box, box);
    
    // Add shine effect
    if (isHead) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
        ctx.beginPath();
        ctx.arc(x * box + box/2, y * box + box/2, box/4, 0, Math.PI * 2);
        ctx.fill();
    }
}

// Initialize game
function initGame() {
    clearInterval(gameLoop);
    
    snake = [];
    // Create initial snake with 3 segments at the center of the canvas
    for (let i = 0; i < 3; i++) {
        snake.push({
            x: Math.floor(totalBoxes / 2) - i,
            y: Math.floor(totalBoxes / 2)
        });
    }
    
    score = 0;
    scoreElement.textContent = score;
    
    direction = "right";
    nextDirection = "right";
    
    // Reset speed
    baseSpeed = initialSpeed;
    currentSpeed = baseSpeed;
    
    // Create initial food, fire, and speed boost
    createFood();
    createFire();
    createSpeedBoost();
    
    // Reset speed boost state
    speedBoostActive = false;
    if (speedBoostTimer) clearTimeout(speedBoostTimer);
    
    // Hide game over and pause screens
    gameOverScreen.style.display = "none";
    gamePauseScreen.style.display = "none";
    
    // Draw initial game state
    draw();
}

// Create a new food item at a random position
function createFood() {
    food = {
        x: Math.floor(Math.random() * totalBoxes),
        y: Math.floor(Math.random() * totalBoxes)
    };
    
    // Make sure food doesn't spawn on snake, fire, or speed boost
    while (checkCollision(food, snake) || 
           (fire.x === food.x && fire.y === food.y) ||
           (speedBoost.x === food.x && speedBoost.y === food.y)) {
        food = {
            x: Math.floor(Math.random() * totalBoxes),
            y: Math.floor(Math.random() * totalBoxes)
        };
    }
}

// Create a new fire obstacle at a random position
function createFire() {
    fire = {
        x: Math.floor(Math.random() * totalBoxes),
        y: Math.floor(Math.random() * totalBoxes)
    };
    
    // Make sure fire doesn't spawn on snake, food, or speed boost
    while (checkCollision(fire, snake) || 
           (food.x === fire.x && food.y === fire.y) ||
           (speedBoost.x === fire.x && speedBoost.y === fire.y)) {
        fire = {
            x: Math.floor(Math.random() * totalBoxes),
            y: Math.floor(Math.random() * totalBoxes)
        };
    }
}

// Create a new speed boost at a random position
function createSpeedBoost() {
    speedBoost = {
        x: Math.floor(Math.random() * totalBoxes),
        y: Math.floor(Math.random() * totalBoxes)
    };
    
    // Make sure speed boost doesn't spawn on snake, food, or fire
    while (checkCollision(speedBoost, snake) || 
           (food.x === speedBoost.x && food.y === speedBoost.y) ||
           (fire.x === speedBoost.x && fire.y === speedBoost.y)) {
        speedBoost = {
            x: Math.floor(Math.random() * totalBoxes),
            y: Math.floor(Math.random() * totalBoxes)
        };
    }
}

// Check if an object collides with an array of objects
function checkCollision(obj, arr) {
    for (let i = 0; i < arr.length; i++) {
        if (arr[i].x === obj.x && arr[i].y === obj.y) {
            return true;
        }
    }
    return false;
}

// Check if the snake hits the wall or itself
function checkGameOver() {
    // Check if snake hits the wall
    if (snake[0].x < 0 || snake[0].x >= totalBoxes || 
        snake[0].y < 0 || snake[0].y >= totalBoxes) {
        return true;
    }
    
    // Check if snake hits itself
    for (let i = 1; i < snake.length; i++) {
        if (snake[0].x === snake[i].x && snake[0].y === snake[i].y) {
            return true;
        }
    }
    
    return false;
}

// Update speed based on score
function updateSpeed() {
    // Calculate new base speed
    baseSpeed = Math.max(minSpeed, initialSpeed - (score * speedIncreasePerPoint));
    
    // If speed boost is active, use boost speed
    currentSpeed = speedBoostActive ? Math.max(minSpeed, baseSpeed * 0.5) : baseSpeed;
    
    // Update the game loop with new speed
    clearInterval(gameLoop);
    gameLoop = setInterval(update, currentSpeed);
}

// Draw the game
function draw() {
    // Clear the canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw the snake
    for (let i = 0; i < snake.length; i++) {
        drawSnakeSegment(snake[i].x, snake[i].y, i === 0);
    }
    
    // Draw the food with animation
    const time = Date.now() * 0.002;
    const scale = 0.8 + Math.sin(time) * 0.2;
    const foodSize = box * scale;
    
    ctx.fillStyle = '#ffbd69';
    ctx.beginPath();
    ctx.arc(
        food.x * box + box/2,
        food.y * box + box/2,
        foodSize/2,
        0,
        Math.PI * 2
    );
    ctx.fill();
    
    // Add shine to food
    ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
    ctx.beginPath();
    ctx.arc(
        food.x * box + box/3,
        food.y * box + box/3,
        foodSize/6,
        0,
        Math.PI * 2
    );
    ctx.fill();
    
    // Draw the fire with animation
    const fireSize = box * (0.7 + Math.sin(time * 1.5) * 0.1);
    ctx.fillStyle = '#ff6b6b';
    ctx.beginPath();
    ctx.moveTo(fire.x * box + box/2, fire.y * box + box/2 - fireSize/2);
    ctx.lineTo(fire.x * box + box/2 + fireSize/3, fire.y * box + box/2 + fireSize/3);
    ctx.lineTo(fire.x * box + box/2 - fireSize/3, fire.y * box + box/2 + fireSize/3);
    ctx.closePath();
    ctx.fill();
    
    // Draw the speed boost with animation
    const boostSize = box * (0.8 + Math.sin(time * 2) * 0.1);
    ctx.fillStyle = '#c8ffff';
    ctx.beginPath();
    ctx.moveTo(speedBoost.x * box + box/2, speedBoost.y * box + box/5);
    ctx.lineTo(speedBoost.x * box + box - box/5, speedBoost.y * box + box/2);
    ctx.lineTo(speedBoost.x * box + box/2, speedBoost.y * box + box - box/5);
    ctx.lineTo(speedBoost.x * box + box/5, speedBoost.y * box + box/2);
    ctx.closePath();
    ctx.fill();
    
    // Add glow effect to speed boost
    ctx.shadowColor = '#c8ffff';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
}

// Update the game state
function update() {
    // Create new head position based on current direction
    let newHead = {
        x: snake[0].x,
        y: snake[0].y
    };
    
    // Update direction from nextDirection
    direction = nextDirection;
    
    // Update head position based on direction
    switch (direction) {
        case "up":
            newHead.y--;
            break;
        case "down":
            newHead.y++;
            break;
        case "left":
            newHead.x--;
            break;
        case "right":
            newHead.x++;
            break;
    }
    
    // Check if game is over
    snake.unshift(newHead);
    
    if (checkGameOver()) {
        endGame();
        return;
    }
    
    // Check if snake eats food
    if (snake[0].x === food.x && snake[0].y === food.y) {
            // Play eat sound
    eatSound.play();
        // Increase score
        score += 10;
        scoreElement.textContent = score;
        
        // Update speed based on new score
        updateSpeed();
        
        // Update high score if needed
        if (score > highScore) {
            highScore = score;
            highScoreElement.textContent = highScore;
            localStorage.setItem("snakeHighScore", highScore);
        }
        
        // Create new food
        createFood();
    } else if (snake[0].x === fire.x && snake[0].y === fire.y) {
        fireSound.play();
        // Decrease score if snake hits fire
        score = Math.max(0, score - 5);
        scoreElement.textContent = score;
        
        // Update speed based on new score
        updateSpeed();
        
        // Remove tail segment if possible
        if (snake.length > 1) {
            snake.pop();
        }
        
        // Create new fire
        createFire();
    } else if (snake[0].x === speedBoost.x && snake[0].y === speedBoost.y) {
        boostSound.play();
        // Activate speed boost
        speedBoostActive = true;
        currentSpeed = Math.max(minSpeed, baseSpeed * 0.5);
        clearInterval(gameLoop);
        gameLoop = setInterval(update, currentSpeed);
        
        // Reset speed boost after 5 seconds
        if (speedBoostTimer) clearTimeout(speedBoostTimer);
        speedBoostTimer = setTimeout(() => {
            speedBoostActive = false;
            currentSpeed = baseSpeed;
            clearInterval(gameLoop);
            gameLoop = setInterval(update, currentSpeed);
            createSpeedBoost();
        }, 5000);
        
        // Create new speed boost
        createSpeedBoost();
    } else {
        // Remove tail segment if no food was eaten
        snake.pop();
    }
    
    // Draw the updated game state
    draw();
}

// End the game
function endGame() {
    clearInterval(gameLoop);
    gameRunning = false;
    gameOverSound.play();
    
    // Show game over screen
    finalScoreElement.textContent = score;
    gameOverScreen.style.display = "flex";
}

// Start the game
function startGame() {
    if (!gameRunning) {
        initGame();
        gameRunning = true;
        gameLoop = setInterval(update, currentSpeed);
    }
}

// Pause the game
function pauseGame() {
    if (gameRunning && !gamePaused) {
        clearInterval(gameLoop);
        gamePaused = true;
        gamePauseScreen.style.display = "flex";
    }
}

// Resume the game
function resumeGame() {
    if (gameRunning && gamePaused) {
        gameLoop = setInterval(update, currentSpeed);
        gamePaused = false;
        gamePauseScreen.style.display = "none";
    }
}

// Event listeners for buttons
startButton.addEventListener("click", startGame);
pauseButton.addEventListener("click", pauseGame);
restartButton.addEventListener("click", () => {
    initGame();
    if (gameRunning) {
        clearInterval(gameLoop);
        gameLoop = setInterval(update, currentSpeed);
    }
});
newGameButton.addEventListener("click", startGame);
resumeButton.addEventListener("click", resumeGame);

// Keyboard event listeners
document.addEventListener("keydown", (event) => {
    // Prevent default action for arrow keys to avoid page scrolling
    if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(event.code)) {
        event.preventDefault();
    }
    
    // Change direction based on key pressed
    // Make sure the snake can't immediately reverse direction
    switch (event.code) {
        case "ArrowUp":
            if (direction !== "down") nextDirection = "up";
            break;
        case "ArrowDown":
            if (direction !== "up") nextDirection = "down";
            break;
        case "ArrowLeft":
            if (direction !== "right") nextDirection = "left";
            break;
        case "ArrowRight":
            if (direction !== "left") nextDirection = "right";
            break;
        case "Space":
            if (gameRunning && !gamePaused) {
                pauseGame();
            } else if (gameRunning && gamePaused) {
                resumeGame();
            } else {
                startGame();
            }
            break;
    }
});
// Mobile touch controls
if (isMobile) {
    // Add haptic feedback
    function vibrate(duration = 50) {
        if (navigator.vibrate) {
            navigator.vibrate(duration);
        }
    }
    
    // Update touch event listeners
    const handleDirectionChange = (newDirection) => {
        if (direction !== newDirection) {
            nextDirection = newDirection;
            vibrate();
        }
    };
    
    document.getElementById('upButton').addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleDirectionChange("up");
    });
    
    document.getElementById('downButton').addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleDirectionChange("down");
    });
    
    document.getElementById('leftButton').addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleDirectionChange("left");
    });
    
    document.getElementById('rightButton').addEventListener('touchstart', (e) => {
        e.preventDefault();
        handleDirectionChange("right");
    });
    
    // Update swipe handling
    function handleSwipe() {
        const xDiff = touchStartX - touchEndX;
        const yDiff = touchStartY - touchEndY;
        const threshold = 50; // Minimum distance for swipe
        
        if (Math.abs(xDiff) > threshold || Math.abs(yDiff) > threshold) {
            if (Math.abs(xDiff) > Math.abs(yDiff)) {
                if (xDiff > 0) {
                    handleDirectionChange("left");
                } else {
                    handleDirectionChange("right");
                }
            } else {
                if (yDiff > 0) {
                    handleDirectionChange("up");
                } else {
                    handleDirectionChange("down");
                }
            }
            vibrate();
        }
    }
}
// Initialize the game when the page loads
window.onload = () => {
    resizeCanvas();
    initGame();
};
</script>
